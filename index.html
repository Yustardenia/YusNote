<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YusNote | Moonlit Window</title>
    <script type="module" src="./src/pages/home.ts"></script>
  </head>
  <body>
    <div class="site-shell home-shell">
      <main class="home-layout">
        <aside class="home-sidebar panel">
          <div class="brand-lockup home-brand">
            <span class="brand-mark">Personal Site</span>
            <span class="brand-title">YusNote</span>
            <span class="brand-subtitle">Moonlit Window</span>
          </div>

          <button class="theme-button sidebar-theme" type="button" data-theme-toggle></button>

          <section class="sidebar-section">
            <div class="split-actions">
              <div class="sidebar-section__title">常驻链接</div>
              <button class="ghost-button" type="button" id="addQuickLinkButton">新增</button>
            </div>
            <ul class="list-reset mini-list sidebar-links" id="quickLinksList"></ul>
          </section>
        </aside>

        <section class="home-center">
          <article class="showcase-panel panel">
            <form class="showcase-search" id="homeSearchForm">
              <label class="showcase-search__engine">
                <span class="sr-only">搜索源</span>
                <select id="homeSearchEngine" aria-label="搜索源"></select>
              </label>
              <label class="showcase-search__field">
                <span class="sr-only">搜索内容</span>
                <input id="homeSearchQuery" type="search" placeholder="搜资料、找图、找视频，或者今天要继续写的东西" />
              </label>
              <button class="button" type="submit">开始搜索</button>
            </form>

            <div class="showcase-copy">
              <span class="eyebrow">Site Window</span>
              <h1 class="page-heading" id="showcaseTitle"></h1>
              <div class="showcase-icon-grid" id="showcaseIconGrid"></div>
            </div>
          </article>

          <article class="instruction-window panel">
            <div class="instruction-window__toolbar">
              <img class="instruction-window__icon" id="instructionImage" alt="" />
              <div class="split-actions">
                <button class="ghost-button" type="button" id="refreshInstructionButton">刷新</button>
                <button class="ghost-button" type="button" id="copyInstructionButton">复制</button>
              </div>
            </div>
            <div class="instruction-window__screen">
              <p class="instruction-line" id="instructionPrimary"></p>
            </div>
            <p class="instruction-disclaimer">虚构文本，请勿执行危害他人的指令。</p>
          </article>
        </section>

        <aside class="home-daily">
          <article class="surface daily-panel">
            <div class="split-actions">
              <div class="daily-title">📌 待办</div>
              <a class="ghost-button" href="./tools/todo.html">打开</a>
            </div>
            <ul class="list-reset mini-list" id="todoPreview"></ul>
          </article>

          <article class="surface daily-panel">
            <div class="split-actions">
              <div class="daily-title">🗓 今日日程</div>
              <a class="ghost-button" href="./tools/schedule.html">打开</a>
            </div>
            <ul class="list-reset mini-list" id="schedulePreview"></ul>
          </article>

          <article class="surface daily-panel">
            <div class="split-actions">
              <div class="daily-title">⏳ 倒计时</div>
              <button class="ghost-button" type="button" id="editCountdownButton">编辑</button>
            </div>
            <div class="metric-value" id="countdownValue">-- : -- : -- : --</div>
            <p class="card-copy" id="countdownTitle"></p>
          </article>
        </aside>
      </main>
    </div>
  </body>
</html>
