<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金钱卦 | YusNote</title>
    <script type="module" src="../src/pages/divination.ts"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-lockup">
          <span class="brand-mark">Tool</span>
          <span class="brand-title">金钱卦</span>
          <span class="brand-subtitle">保留趣味起卦体验，但改成纯前端推演。</span>
        </div>
        <div class="nav-row">
          <a class="nav-chip" data-nav="home" href="../index.html">首页</a>
          <a class="nav-chip" data-nav="tools" href="./divination.html">工具</a>
          <a class="nav-chip" data-nav="docs" href="../docs/index.html">内容</a>
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="page-main">
        <section class="surface" style="max-width: 900px; margin: 0 auto">
          <span class="eyebrow">Divination</span>
          <h1 class="page-heading">起一卦，看看眼下的节奏。</h1>
          <p class="lead">每次会模拟六次掷钱，得到主卦、动爻和一段偏行动向的提示。</p>
          <div class="split-actions">
            <button class="button" type="button" id="castGuaButton">开始起卦</button>
          </div>
          <div class="grid-2" style="margin-top: 24px">
            <article class="surface">
              <div class="label">卦象</div>
              <div id="hexagramLines" class="stack" style="margin-top: 16px"></div>
            </article>
            <article class="surface">
              <div class="label">解读</div>
              <div class="stack" style="margin-top: 16px">
                <strong id="guaName">尚未起卦</strong>
                <span class="muted" id="guaSummary">点击按钮后开始模拟掷钱。</span>
                <div class="card-copy" id="guaAdvice"></div>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>Divination 工具页</span>
        <span>© <span data-year></span> 静态版</span>
      </footer>
    </div>
  </body>
</html>
