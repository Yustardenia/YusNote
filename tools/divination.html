<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金钱卦 | YusNote</title>
    <script type="module" src="../src/pages/divination.ts"></script>
  </head>
  <body>
    <div class="workspace-shell">
      <header class="workspace-topbar">
        <div class="workspace-topbar__title">
          <a class="workspace-link" href="../index.html">返回首页</a>
          <strong>占卜</strong>
        </div>
        <div class="workspace-topbar__actions">
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="workspace-main">
        <section class="surface" style="max-width: 900px; margin: 0 auto">
          <span class="eyebrow">Divination</span>
          <h1 class="page-heading">起一卦，看看眼下的节奏。</h1>
          <p class="lead">每次会模拟六次掷铜钱，得到主卦、动爻和一段偏行动向的提示。</p>
          <div class="split-actions">
            <button class="button" type="button" id="castGuaButton">开始起卦</button>
          </div>
          <div class="grid-2" style="margin-top: 24px">
            <article class="surface">
              <div class="label">卦象</div>
              <div id="hexagramLines" class="stack" style="margin-top: 16px"></div>
            </article>
            <article class="surface">
              <div class="label">解读</div>
              <div class="stack" style="margin-top: 16px">
                <strong id="guaName">尚未起卦</strong>
                <span class="muted" id="guaSummary">点击按钮后开始模拟掷铜钱。</span>
                <div class="card-copy" id="guaAdvice"></div>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
