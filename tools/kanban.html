<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>看板 | YusNote</title>
    <script type="module" src="../src/pages/kanban.ts"></script>
  </head>
  <body>
    <div class="workspace-shell">
      <header class="workspace-topbar">
        <div class="workspace-topbar__title">
          <a class="workspace-link" href="../index.html">返回首页</a>
          <strong>看板</strong>
        </div>
        <div class="workspace-topbar__actions">
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="workspace-main">
        <section class="grid-3" id="kanbanBoard">
          <article class="surface" data-column="backlog">
            <div class="split-actions">
              <div>
                <div class="label">Backlog</div>
                <strong id="countBacklog">0</strong>
              </div>
              <button class="ghost-button" type="button" data-add="backlog">新增</button>
            </div>
            <div class="stack" id="backlogList" style="margin-top: 16px"></div>
          </article>

          <article class="surface" data-column="doing">
            <div class="split-actions">
              <div>
                <div class="label">Doing</div>
                <strong id="countDoing">0</strong>
              </div>
              <button class="ghost-button" type="button" data-add="doing">新增</button>
            </div>
            <div class="stack" id="doingList" style="margin-top: 16px"></div>
          </article>

          <article class="surface" data-column="done">
            <div class="split-actions">
              <div>
                <div class="label">Done</div>
                <strong id="countDone">0</strong>
              </div>
              <button class="ghost-button" type="button" data-add="done">新增</button>
            </div>
            <div class="stack" id="doneList" style="margin-top: 16px"></div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
