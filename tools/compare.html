<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录比对 | YusNote</title>
    <script type="module" src="../src/pages/compare.ts"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-lockup">
          <span class="brand-mark">Tool</span>
          <span class="brand-title">目录比对</span>
          <span class="brand-subtitle">浏览器里完成目录分析，适合整理重复文件。</span>
        </div>
        <div class="nav-row">
          <a class="nav-chip" data-nav="home" href="../index.html">首页</a>
          <a class="nav-chip" data-nav="tools" href="./compare.html">工具</a>
          <a class="nav-chip" data-nav="docs" href="../docs/index.html">内容</a>
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="page-main">
        <section class="page-hero">
          <div>
            <span class="eyebrow">Compare</span>
            <h1>先比较，再决定删什么。</h1>
            <p class="lead">默认忽略扩展名，只比对根目录之后的相对路径与文件名主体。</p>
          </div>
        </section>

        <section class="grid-2">
          <article class="surface">
            <div class="field">
              <label for="folderA">目录 A（待清理）</label>
              <input id="folderA" type="file" webkitdirectory directory multiple />
            </div>
          </article>
          <article class="surface">
            <div class="field">
              <label for="folderB">目录 B（参照）</label>
              <input id="folderB" type="file" webkitdirectory directory multiple />
            </div>
          </article>
        </section>

        <section class="surface stack">
          <div class="split-actions">
            <button class="button" type="button" id="compareButton">开始比对</button>
            <button class="ghost-button" type="button" id="copyCommandButton">复制删除命令</button>
          </div>
          <div class="grid-3">
            <div class="metric-card"><div class="metric-label">A 独有</div><div class="metric-value" id="onlyACount">0</div></div>
            <div class="metric-card"><div class="metric-label">共有</div><div class="metric-value" id="matchCount">0</div></div>
            <div class="metric-card"><div class="metric-label">B 独有</div><div class="metric-value" id="onlyBCount">0</div></div>
          </div>
          <textarea id="commandOutput" placeholder="比对后会在这里生成 PowerShell 删除命令"></textarea>
        </section>

        <section class="table-shell">
          <table>
            <thead>
              <tr>
                <th>相对路径</th>
                <th>状态</th>
                <th>说明</th>
              </tr>
            </thead>
            <tbody id="compareTableBody"></tbody>
          </table>
        </section>
      </main>

      <footer class="site-footer">
        <span>Compare 工具页</span>
        <span>© <span data-year></span> 静态版</span>
      </footer>
    </div>
  </body>
</html>
