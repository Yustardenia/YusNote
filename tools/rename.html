<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>批量重命名 | YusNote</title>
    <script type="module" src="../src/pages/rename.ts"></script>
  </head>
  <body>
    <div class="workspace-shell">
      <header class="workspace-topbar">
        <div class="workspace-topbar__title">
          <a class="workspace-link" href="../index.html">返回首页</a>
          <strong>批量重命名</strong>
        </div>
        <div class="workspace-topbar__actions">
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="workspace-main">
        <section class="surface stack">
          <div class="grid-2">
            <div class="field">
              <label for="renameFileInput">导入文件</label>
              <input id="renameFileInput" type="file" multiple />
            </div>
            <div class="field">
              <label for="renamePrefix">编号前缀</label>
              <input id="renamePrefix" type="text" placeholder="例如：scene 或 chapter" />
            </div>
          </div>
          <div class="split-actions">
            <button class="button" type="button" id="autoRenameButton">自动编号</button>
            <button class="ghost-button" type="button" id="clearRenameButton">清空列表</button>
            <button class="ghost-button" type="button" id="downloadZipButton">导出 ZIP</button>
          </div>
        </section>

        <section class="table-shell">
          <table>
            <thead>
              <tr>
                <th>原始文件</th>
                <th>新文件名</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="renameTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
