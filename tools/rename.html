<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>批量重命名 | YusNote</title>
    <script type="module" src="../src/pages/rename.ts"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-lockup">
          <span class="brand-mark">Tool</span>
          <span class="brand-title">批量重命名</span>
          <span class="brand-subtitle">保留本地处理和 ZIP 导出，不再依赖服务器文件夹。</span>
        </div>
        <div class="nav-row">
          <a class="nav-chip" data-nav="home" href="../index.html">首页</a>
          <a class="nav-chip" data-nav="tools" href="./rename.html">工具</a>
          <a class="nav-chip" data-nav="docs" href="../docs/index.html">内容</a>
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="page-main">
        <section class="page-hero">
          <div>
            <span class="eyebrow">Rename</span>
            <h1>浏览器内整理文件名。</h1>
            <p class="lead">支持多文件导入、自动编号、手动修改和 ZIP 导出。</p>
          </div>
        </section>

        <section class="surface stack">
          <div class="grid-2">
            <div class="field">
              <label for="renameFileInput">导入文件</label>
              <input id="renameFileInput" type="file" multiple />
            </div>
            <div class="field">
              <label for="renamePrefix">编号前缀</label>
              <input id="renamePrefix" type="text" placeholder="例如：scene 或 chapter" />
            </div>
          </div>
          <div class="split-actions">
            <button class="button" type="button" id="autoRenameButton">自动编号</button>
            <button class="ghost-button" type="button" id="clearRenameButton">清空列表</button>
            <button class="ghost-button" type="button" id="downloadZipButton">导出 ZIP</button>
          </div>
        </section>

        <section class="table-shell">
          <table>
            <thead>
              <tr>
                <th>原始文件</th>
                <th>新文件名</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="renameTableBody"></tbody>
          </table>
        </section>
      </main>

      <footer class="site-footer">
        <span>Rename 工具页</span>
        <span>© <span data-year></span> 把零散文件整理成更顺眼的样子</span>
      </footer>
    </div>
  </body>
</html>
