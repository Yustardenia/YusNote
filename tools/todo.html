<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo 清单 | YusNote</title>
    <script type="module" src="../src/pages/todo.ts"></script>
  </head>
  <body>
    <div class="workspace-shell">
      <header class="workspace-topbar">
        <div class="workspace-topbar__title">
          <a class="workspace-link" href="../index.html">返回首页</a>
          <strong>Todo</strong>
        </div>
        <div class="workspace-topbar__actions">
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="workspace-main">
        <section class="two-column">
          <article class="surface">
            <form class="form-grid" id="todoForm">
              <div class="field">
                <label for="todoText">任务内容</label>
                <input id="todoText" name="todoText" type="text" placeholder="输入任务内容" required />
              </div>
              <div class="field">
                <label for="todoDueAt">截止时间</label>
                <input id="todoDueAt" name="todoDueAt" type="datetime-local" />
              </div>
              <div class="split-actions">
                <button class="button" type="submit">添加任务</button>
                <button class="ghost-button" type="reset">清空输入</button>
              </div>
            </form>
          </article>

          <article class="surface stack">
            <div class="label">快速筛选</div>
            <div class="split-actions">
              <button class="ghost-button" data-filter="all" type="button">全部</button>
              <button class="ghost-button" data-filter="open" type="button">未完成</button>
              <button class="ghost-button" data-filter="done" type="button">已完成</button>
            </div>
            <div class="muted">当前共 <strong id="todoTotal">0</strong> 条。</div>
          </article>
        </section>

        <section class="surface">
          <div class="label">任务列表</div>
          <ul class="list-reset mini-list" id="todoList" style="margin-top: 16px"></ul>
        </section>
      </main>
    </div>
  </body>
</html>
