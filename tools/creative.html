<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Studio | YusNote</title>
    <script type="module" src="../src/pages/creative.ts"></script>
  </head>
  <body>
    <div class="workspace-shell workspace-shell--creative">
      <header class="workspace-topbar">
        <div class="workspace-topbar__title">
          <a class="workspace-link" href="../index.html">返回首页</a>
          <strong>Creative Studio</strong>
        </div>
        <div class="workspace-topbar__actions">
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="creative-stage-shell">
        <section class="creative-mode-bar surface">
          <div class="creative-mode-bar__tabs">
            <button class="tab-button" type="button" data-creative-tab="markdown" data-active="true">Markdown 笔记</button>
            <button class="tab-button" type="button" data-creative-tab="board">白板</button>
            <button class="tab-button" type="button" data-creative-tab="mindmap">思维导图</button>
            <button class="tab-button" type="button" data-creative-tab="mermaid">Mermaid</button>
          </div>
        </section>

        <article class="surface creative-screen" data-creative-panel="markdown">
          <div class="creative-toolbar">
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" id="createDocButton">新建</button>
              <button class="ghost-button" type="button" id="renameDocButton">重命名</button>
              <button class="ghost-button" type="button" id="duplicateDocButton">复制</button>
              <button class="ghost-button" type="button" id="deleteDocButton">删除</button>
              <button class="ghost-button" type="button" id="importDocButton">导入 .md</button>
              <button class="ghost-button" type="button" id="exportDocButton">导出 .md</button>
              <button class="ghost-button" type="button" id="toggleDocPreviewButton">切换预览</button>
            </div>
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" data-md-insert="h1">H1</button>
              <button class="ghost-button" type="button" data-md-insert="h2">H2</button>
              <button class="ghost-button" type="button" data-md-insert="list">列表</button>
              <button class="ghost-button" type="button" data-md-insert="task">任务</button>
              <button class="ghost-button" type="button" data-md-insert="quote">引用</button>
              <button class="ghost-button" type="button" data-md-insert="code">代码</button>
              <button class="ghost-button" type="button" data-md-insert="table">表格</button>
              <button class="ghost-button" type="button" data-md-insert="callout">Callout</button>
              <button class="ghost-button" type="button" data-md-insert="mermaid">Mermaid</button>
            </div>
          </div>

          <div class="creative-screen__layout creative-screen__layout--markdown">
            <aside class="creative-drawer">
              <div class="field field--compact">
                <input id="docSearchInput" type="search" placeholder="搜索文档名" />
              </div>
              <input id="docImportInput" type="file" accept=".md,text/markdown" hidden />
              <ul class="list-reset workspace-list" id="docList"></ul>
            </aside>

            <div class="creative-editor-grid" data-preview-mode="split" id="markdownWorkspace">
              <div class="field field--grow">
                <label for="markdownInput">Markdown</label>
                <textarea id="markdownInput" spellcheck="false"></textarea>
              </div>
              <div class="field field--grow">
                <label for="markdownPreview">预览</label>
                <div class="creative-preview" id="markdownPreview"></div>
              </div>
            </div>
          </div>
        </article>

        <article class="surface creative-screen" data-creative-panel="board" hidden>
          <div class="creative-toolbar">
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" data-board-tool="select" data-active="true">选择</button>
              <button class="ghost-button" type="button" data-board-tool="pen">画笔</button>
              <button class="ghost-button" type="button" data-board-tool="highlighter">荧光笔</button>
              <button class="ghost-button" type="button" data-board-tool="eraser">橡皮</button>
              <button class="ghost-button" type="button" data-board-tool="line">直线</button>
              <button class="ghost-button" type="button" data-board-tool="rect">矩形</button>
              <button class="ghost-button" type="button" data-board-tool="ellipse">圆形</button>
              <button class="ghost-button" type="button" data-board-tool="arrow">箭头</button>
              <button class="ghost-button" type="button" data-board-tool="text">文字</button>
              <button class="ghost-button" type="button" data-board-tool="note">便签</button>
            </div>
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" id="createBoardProjectButton">新建工程</button>
              <button class="ghost-button" type="button" id="deleteBoardProjectButton">删除工程</button>
              <button class="ghost-button" type="button" id="importBoardImageButton">导入图片</button>
              <button class="ghost-button" type="button" id="importBoardPdfButton">导入 PDF</button>
              <button class="ghost-button" type="button" id="importMarkdownCardsButton">导入 Markdown 卡片</button>
              <button class="ghost-button" type="button" id="sendBoardToMarkdownButton">签入 Markdown</button>
              <button class="ghost-button" type="button" id="undoBoardButton">撤销</button>
              <button class="ghost-button" type="button" id="redoBoardButton">重做</button>
              <button class="ghost-button" type="button" id="zoomOutBoardButton">缩小</button>
              <button class="ghost-button" type="button" id="resetBoardZoomButton">100%</button>
              <button class="ghost-button" type="button" id="zoomInBoardButton">放大</button>
              <span class="pill" id="boardZoomLabel">100%</span>
              <button class="ghost-button" type="button" id="clearBoardButton">清空</button>
              <button class="ghost-button" type="button" id="exportBoardJsonButton">导出 JSON</button>
              <button class="ghost-button" type="button" id="exportBoardPngButton">导出 PNG</button>
              <input id="boardColorInput" type="color" value="#d36ea0" />
              <input id="boardSizeInput" type="range" min="1" max="28" value="5" />
            </div>
          </div>

          <div class="creative-screen__layout creative-screen__layout--board">
            <aside class="creative-drawer creative-drawer--compact">
              <ul class="list-reset workspace-list" id="boardProjectList"></ul>
              <input id="boardImageInput" type="file" accept="image/*" hidden />
              <input id="boardPdfInput" type="file" accept="application/pdf" hidden />
            </aside>
            <div class="board-stage-shell">
              <div class="board-stage" id="boardStage"></div>
            </div>
          </div>
        </article>

        <article class="surface creative-screen" data-creative-panel="mindmap" hidden>
          <div class="creative-toolbar">
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" id="createMindMapButton">新建脑图</button>
              <button class="ghost-button" type="button" id="deleteMindMapProjectButton">删除脑图</button>
              <button class="ghost-button" type="button" id="buildMindMapFromDocButton">从 Markdown 生成</button>
              <button class="ghost-button" type="button" id="addMindMapChildButton">新增子节点</button>
              <button class="ghost-button" type="button" id="addMindMapSiblingButton">新增同级</button>
              <button class="ghost-button" type="button" id="renameMindMapNodeButton">重命名</button>
              <button class="ghost-button" type="button" id="toggleMindMapNodeButton">折叠/展开</button>
              <button class="ghost-button" type="button" id="deleteMindMapNodeButton">删除节点</button>
              <button class="ghost-button" type="button" id="exportMindMapJsonButton">导出 JSON</button>
              <button class="ghost-button" type="button" id="exportMindMapPngButton">导出 SVG</button>
              <input id="mindMapColorInput" type="color" value="#6e6cff" />
            </div>
          </div>

          <div class="creative-screen__layout creative-screen__layout--mindmap">
            <aside class="creative-drawer creative-drawer--compact">
              <ul class="list-reset workspace-list" id="mindMapList"></ul>
            </aside>
            <div class="mindmap-stage-shell">
              <svg class="mindmap-stage" id="mindMapStage"></svg>
            </div>
          </div>
        </article>

        <article class="surface creative-screen" data-creative-panel="mermaid" hidden>
          <div class="creative-toolbar">
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" id="createMermaidSnippetButton">新建</button>
              <button class="ghost-button" type="button" id="deleteMermaidSnippetButton">删除片段</button>
              <button class="ghost-button" type="button" id="saveMermaidSnippetButton">保存片段</button>
              <button class="ghost-button" type="button" id="renderMermaidButton">渲染</button>
              <button class="ghost-button" type="button" id="exportMermaidSvgButton">导出 SVG</button>
            </div>
            <div class="creative-toolbar__group">
              <button class="ghost-button" type="button" data-mermaid-template="flowchart">流程图</button>
              <button class="ghost-button" type="button" data-mermaid-template="sequence">时序图</button>
              <button class="ghost-button" type="button" data-mermaid-template="gantt">甘特图</button>
              <button class="ghost-button" type="button" data-mermaid-template="state">状态图</button>
              <button class="ghost-button" type="button" data-mermaid-template="class">类图</button>
              <button class="ghost-button" type="button" data-mermaid-template="er">ER 图</button>
              <button class="ghost-button" type="button" data-mermaid-template="journey">Journey</button>
              <button class="ghost-button" type="button" data-mermaid-template="mindmap">Mindmap</button>
            </div>
          </div>

          <div class="creative-screen__layout creative-screen__layout--mermaid">
            <aside class="creative-drawer creative-drawer--compact">
              <ul class="list-reset workspace-list" id="mermaidSnippetList"></ul>
            </aside>
            <div class="creative-editor-grid">
              <div class="field field--grow">
                <label for="mermaidInput">Mermaid 代码</label>
                <textarea id="mermaidInput" spellcheck="false"></textarea>
              </div>
              <div class="field field--grow">
                <label for="mermaidPreview">预览</label>
                <div class="creative-preview" id="mermaidPreview"></div>
              </div>
            </div>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
