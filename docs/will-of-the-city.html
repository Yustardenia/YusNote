<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📡 指令 | YusNote</title>
    <script type="module" src="../src/pages/will-of-the-city.ts"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-lockup">
          <span class="brand-mark">Instruction</span>
          <span class="brand-title">指令</span>
          <span class="brand-subtitle">Sidebar Broadcast Console</span>
        </div>
        <div class="nav-row">
          <a class="nav-chip" data-nav="home" href="../index.html">首页</a>
          <a class="nav-chip" data-nav="tools" href="../tools/todo.html">工具</a>
          <a class="nav-chip" data-nav="docs" href="./index.html">内容</a>
          <button class="theme-button" type="button" data-theme-toggle></button>
        </div>
      </header>

      <main class="docs-layout page-main">
        <section class="city-layout">
          <aside class="surface city-sidebar" id="citySidebar">
            <div class="city-sidebar__top">
              <img class="city-sidebar__icon" src="../assets/docs/instruction.png" alt="指令图标" />
              <div>
                <span class="eyebrow">City Signal</span>
                <h1 class="city-sidebar__title">📡 指令</h1>
              </div>
              <button class="ghost-button city-sidebar__toggle" type="button" id="citySidebarToggle">展开控制栏</button>
            </div>
            <div class="city-sidebar__body" id="citySidebarBody">
              <p class="card-copy">按下按钮，生成一条属于夜间城市、同时带着食指味道的怪诞指令。</p>
              <div class="chip-row">
                <span class="meta-chip" id="cityBroadcastType">夜间指令</span>
                <span class="meta-chip" id="cityBroadcastCode">Signal 00</span>
              </div>
              <div class="stack">
                <button class="button" type="button" id="cityGenerateButton">生成新指令</button>
                <button class="ghost-button" type="button" id="cityCopyButton">复制文本</button>
              </div>
              <div class="label">🗂 归档标签</div>
              <div class="chip-row" id="cityTags"></div>
              <div class="label">📎 回声注记</div>
              <p class="card-copy" id="cityFooter"></p>
            </div>
          </aside>

          <article class="article city-console">
            <div class="city-console__display">
              <p class="city-console__line" id="cityLinePrimary"></p>
              <p class="city-console__line city-console__line--soft" id="cityLineSecondary"></p>
            </div>
          </article>
        </section>
      </main>

      <footer class="site-footer">
        <span>指令</span>
        <span>&copy; <span data-year></span> 冷漠、怪诞且不合时宜的夜间回执</span>
      </footer>
    </div>
  </body>
</html>
